spring.application.name=backend
server.port=8080
# Nunca vazar stack trace nas respostas de erro (o devtools liga isso por padrao em dev -
# essa config explicita evita depender so do devtools ser excluido do build de producao).
server.error.include-stacktrace=never
server.error.include-message=always
# MongoDB
# IMPORTANTE: o prefixo certo nesta versao do Spring Boot (4.0.5) e "spring.mongodb",
# nao "spring.data.mongodb" (esse ultimo agora e so pra config da camada Spring Data,
# como auto-index-creation abaixo - nao tem mais host/port/uri/username/password).
# Com o prefixo antigo, a propriedade era silenciosamente ignorada e a app sempre
# conectava em localhost:27017 sem credencial nenhuma, nao importa o que fosse passado
# via env var, argumento de linha de comando ou qualquer outra fonte.
spring.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE}?authSource=admin
# Desligado: rodando como .jar empacotado (java -jar / Docker), a criacao automatica
# de indices no boot acontece rapido demais e corre com a autenticacao SCRAM daquela
# conexao ainda nao ter terminado de negociar - o Mongo recusa com "Unauthorized" e a
# aplicacao inteira falha ao subir. Os indices que o projeto precisa ja sao criados
# manualmente pelo script de seed (seed/mongo-seed.js).
spring.data.mongodb.auto-index-creation=false

jwt.secret=${JWT_SECRET}

FRONTEND_URL=${FRONTEND_URL:http://localhost:3000}

import.api-key=${IMPORT_API_KEY:}

# Mail (verificacao de e-mail)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@extensao-unb.local}
