spring.application.name=backend
server.port=8080
# Nunca vazar stack trace nas respostas de erro (o devtools liga isso por padrao em dev -
# essa config explicita evita depender so do devtools ser excluido do build de producao).
server.error.include-stacktrace=never
server.error.include-message=always
# MongoDB
spring.data.mongodb.uri=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE}?authSource=admin
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET}

FRONTEND_URL=${FRONTEND_URL:http://localhost:3000}

import.api-key=${IMPORT_API_KEY:}

# Mail (verificacao de e-mail)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@extensao-unb.local}
