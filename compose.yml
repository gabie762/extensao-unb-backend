services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - ${MONGO_PORT:-27017}:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: false
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - 1025:1025 # SMTP - aponte MAIL_HOST=localhost e MAIL_PORT=1025 no .env
      - 8025:8025 # UI web para ver os e-mails de verificacao recebidos
  backend:
    image: extensao-unb-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      # Sem isso, o backend tenta mandar e-mail de verificacao pra "localhost:587"
      # (o padrao do application.properties), que dentro DESTE container nao leva
      # a lugar nenhum - precisa do nome do servico do Mailpit.
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      mongo:
        condition: service_healthy
  frontend:
    image: extensao-unb-frontend:latest
    build:
      context: ../../extensao-unb-front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 3000:3000
    # Sem variaveis de ambiente aqui: o navegador so fala com /api na propria
    # origem do frontend, que o Nitro repassa pro backend via rede interna
    # Docker (http://backend:8080) - ver routeRules em nuxt.config.ts.
    depends_on:
      - backend

volumes:
  mongo:
    driver: local