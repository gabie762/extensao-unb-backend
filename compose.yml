services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - ${MONGO_PORT:-27017}:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: false
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - 1025:1025 # SMTP - aponte MAIL_HOST=localhost e MAIL_PORT=1025 no .env
      - 8025:8025 # UI web para ver os e-mails de verificacao recebidos
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      # Sem isso, o backend tenta mandar e-mail de verificacao pra "localhost:587"
      # (o padrao do application.properties), que dentro DESTE container nao leva
      # a lugar nenhum - precisa do nome do servico do Mailpit.
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      mongo:
        condition: service_healthy
  frontend:
    build:
      context: ../../extensao-unb-front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      # Navegador (roda na sua maquina) - passa pelo Caddy, que encaminha /api pro backend.
      # Sem porta: o Caddy escuta na 80, a porta padrao da web.
      NUXT_PUBLIC_API_BASE: http://localhost/api
      # SSR (roda dentro deste container) - fala direto com o backend pela rede interna,
      # nao precisa passar pelo Caddy (que e so pra trafego vindo de fora).
      NUXT_API_BASE_SERVER: http://backend:8080
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      # ":Z" e o "z"/"Z" que o SELinux (padrao no Fedora) exige pra deixar o
      # container ler um arquivo montado do host - sem isso, da "permission
      # denied" mesmo com o arquivo com permissao normal (rw-r--r--).
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  mongo:
    driver: local
  caddy_data:
  caddy_config: